name: quotation-ci

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/light-quotation-v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical browser journeys
        run: npx playwright test

      - name: Upload V3 visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-preview
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
